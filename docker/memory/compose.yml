services:
  memory-installer:
    build:
      context: ../..
      dockerfile: docker/memory/Dockerfile
    container_name: memory-installer
    environment:
      ANSIBLE_HOST_KEY_CHECKING: "False"
      INSTALL_FORCE: "${INSTALL_FORCE:-false}"
      REBUILD_GLUSTER: "${REBUILD_GLUSTER:-false}"
    volumes:
      - ../../secrets:/run/memory-secrets:ro
