---
- name: Prepare K3s nodes
  hosts: homelab
  become: true
  become_flags: -n
  tasks:
    - name: Install K3s prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - iptables
        state: present

    - name: Check Raspberry Pi kernel command line
      ansible.builtin.stat:
        path: /boot/firmware/cmdline.txt
      register: raspberry_pi_cmdline

    - name: Enable memory cgroups
      ansible.builtin.lineinfile:
        path: /boot/firmware/cmdline.txt
        regexp: '^(?!.*cgroup_memory=1)(.*)$'
        line: '\1 cgroup_memory=1 cgroup_enable=memory'
        backrefs: true
      register: cgroup_config
      when: raspberry_pi_cmdline.stat.exists

    - name: Reboot after kernel command line change
      ansible.builtin.reboot:
        reboot_timeout: 300
      when: cgroup_config.changed | default(false)

- name: Install K3s server on onyx
  hosts: onyx
  become: true
  become_flags: -n
  tasks:
    - name: Install K3s server
      ansible.builtin.shell: >-
        curl -sfL https://get.k3s.io |
        INSTALL_K3S_EXEC="server --write-kubeconfig-mode 644"
        K3S_NODE_NAME=onyx
        sh -s -
      args:
        creates: /usr/local/bin/k3s

    - name: Configure Traefik NodePort
      ansible.builtin.copy:
        dest: /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
        mode: '0644'
        content: |
          apiVersion: helm.cattle.io/v1
          kind: HelmChartConfig
          metadata:
            name: traefik
            namespace: kube-system
          spec:
            valuesContent: |-
              service:
                type: NodePort
              ports:
                web:
                  nodePort: 30080
                websecure:
                  nodePort: 30443

    - name: Apply Traefik configuration
      ansible.builtin.systemd:
        name: k3s
        state: restarted

    - name: Ensure K3s server is running
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true

    - name: Read K3s server token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_server_token

- name: Install K3s agent on ruby
  hosts: ruby
  become: true
  become_flags: -n
  tasks:
    - name: Install K3s agent
      ansible.builtin.shell: >-
        curl -sfL https://get.k3s.io |
        K3S_URL=https://192.168.0.2:6443
        K3S_TOKEN="{{ hostvars['onyx']['k3s_server_token']['content'] | b64decode | trim }}"
        K3S_NODE_NAME=ruby
        sh -s - agent
      args:
        creates: /usr/local/bin/k3s
      no_log: true

    - name: Ensure K3s agent is running
      ansible.builtin.systemd:
        name: k3s-agent
        state: started
        enabled: true

- name: Verify K3s cluster
  hosts: onyx
  become: true
  become_flags: -n
  tasks:
    - name: Wait for onyx node
      ansible.builtin.command: kubectl get node onyx --no-headers
      register: onyx_node
      retries: 12
      delay: 5
      until: onyx_node.rc == 0 and ' Ready ' in (' ' + onyx_node.stdout + ' ')
      changed_when: false

    - name: Verify onyx can schedule workloads
      ansible.builtin.command: kubectl get node onyx -o jsonpath='{.spec.taints}'
      register: onyx_taints
      changed_when: false
      failed_when: "'NoSchedule' in onyx_taints.stdout"

    - name: Verify onyx is schedulable
      ansible.builtin.command: kubectl get node onyx -o jsonpath='{.spec.unschedulable}'
      register: onyx_schedulable
      changed_when: false
      failed_when: onyx_schedulable.stdout == 'true'

    - name: Wait for Traefik NodePort
      ansible.builtin.command: kubectl -n kube-system get service traefik -o jsonpath='{.spec.ports[?(@.name=="web")].nodePort}'
      register: traefik_nodeport
      retries: 24
      delay: 5
      until: traefik_nodeport.rc == 0 and traefik_nodeport.stdout == '30080'
      changed_when: false

    - name: Install ingress smoke test
      ansible.builtin.copy:
        src: test-ingress.yml
        dest: /var/lib/rancher/k3s/server/manifests/test-ingress.yaml
        mode: '0644'

    - name: Wait for ingress smoke test backend
      ansible.builtin.command: kubectl get deployment ingress-smoke-test -o jsonpath='{.status.availableReplicas}'
      register: smoke_test_replicas
      retries: 24
      delay: 5
      until: smoke_test_replicas.rc == 0 and smoke_test_replicas.stdout == '1'
      changed_when: false

    - name: Verify ingress routes to the smoke test service
      ansible.builtin.uri:
        url: http://192.168.0.2:30080/
        headers:
          Host: ingress-smoke.test
        status_code: 200
      register: ingress_smoke_response
      retries: 24
      delay: 5
      until: ingress_smoke_response.status == 200
      changed_when: false

    - name: Wait for ruby node
      ansible.builtin.command: kubectl get node ruby --no-headers
      register: ruby_node
      retries: 12
      delay: 5
      until: ruby_node.rc == 0 and ' Ready ' in (' ' + ruby_node.stdout + ' ')
      changed_when: false

    - name: Deploy an image from the local registry
      ansible.builtin.shell: >-
        kubectl create deployment homelab-registry-smoke
        --image=192.168.0.2:5000/homelab/busybox:latest
        -- /bin/sh -c "sleep 120"
      register: registry_deployment
      changed_when: registry_deployment.rc == 0
      failed_when: registry_deployment.rc != 0 and 'already exists' not in registry_deployment.stderr

    - name: Wait for the local registry image deployment
      ansible.builtin.command: kubectl rollout status deployment/homelab-registry-smoke --timeout=120s
      changed_when: false

    - name: Remove the local registry image deployment
      ansible.builtin.command: kubectl delete deployment homelab-registry-smoke --ignore-not-found
      changed_when: false
