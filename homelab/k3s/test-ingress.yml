apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-smoke-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingress-smoke-test
  template:
    metadata:
      labels:
        app: ingress-smoke-test
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-smoke-test
spec:
  selector:
    app: ingress-smoke-test
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-smoke-test
spec:
  ingressClassName: traefik
  rules:
    - host: ingress-smoke.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ingress-smoke-test
                port:
                  number: 80
