---
- name: Configure ZRAM only
  hosts: homelab
  become: true
  become_flags: -n
  tasks:
    - name: Install zram-tools
      ansible.builtin.apt:
        name: zram-tools
        state: present
        update_cache: true

    - name: Check for an active swap file
      ansible.builtin.command: swapon --show=NAME --noheadings
      register: active_swaps
      changed_when: false

    - name: Disable existing swap file
      ansible.builtin.command: swapoff /var/swap
      when: "'/var/swap' in active_swaps.stdout_lines"

    - name: Remove existing swap file if it exists
      block:
        - name: Check for swap file
          ansible.builtin.stat:
            path: /var/swap
          register: swapfile_check

        - name: Remove swap file
          ansible.builtin.file:
            path: /var/swap
            state: absent
          when: swapfile_check.stat.exists

        - name: Remove only the swap file entry from /etc/fstab
          ansible.builtin.lineinfile:
            path: /etc/fstab
            regexp: '^/var/swap\s'
            state: absent

    - name: Stop existing ZRAM swap service
      ansible.builtin.systemd:
        name: zramswap
        state: stopped
      failed_when: false
      changed_when: false

    - name: Disable existing ZRAM swap
      ansible.builtin.command: swapoff /dev/zram0
      failed_when: false
      changed_when: false

    - name: Reset existing ZRAM device
      ansible.builtin.shell: |
        if test -w /sys/block/zram0/reset; then
          echo 1 > /sys/block/zram0/reset
        fi
      changed_when: false

    - name: Ensure ZRAM kernel module is loaded
      ansible.builtin.command: modprobe zram
      changed_when: false

    - name: Detect a supported ZRAM compression algorithm
      ansible.builtin.shell: |
        for algorithm in zstd lz4 lzo-rle lzo; do
          grep -qw "$algorithm" /sys/block/zram0/comp_algorithm && {
            echo "$algorithm"
            exit 0
          }
        done
        exit 1
      register: zram_algorithm
      changed_when: false

    - name: Configure ZRAM in /etc/default/zramswap
      ansible.builtin.copy:
        dest: /etc/default/zramswap
        content: |
          ALGO={{ zram_algorithm.stdout | trim }}
          SIZE=6144
          PRIORITY=100
        mode: '0644'
      notify: Restart ZRAM swap service

    - name: Ensure ZRAM swap service is enabled and running
      ansible.builtin.systemd:
        name: zramswap
        state: started
        enabled: true

    - name: Apply ZRAM configuration changes
      ansible.builtin.meta: flush_handlers

    - name: Verify ZRAM swap is active
      ansible.builtin.command: swapon --show=NAME --noheadings
      register: zram_status
      changed_when: false
      retries: 5
      delay: 2
      until: "'/dev/zram0' in zram_status.stdout_lines"

  handlers:
    - name: Restart ZRAM swap service
      ansible.builtin.systemd:
        name: zramswap
        state: restarted
